app: ewolff_microservice-kafka
journey: create-order
risk:
  id: R3
  pattern: P8
  title: "Save, then publish an event"
  location: OrderService#order
  file: microservice-kafka/microservice-kafka-order/src/main/java/com/ewolff/microservice/order/logic/OrderService.java
  line: 21
  confidence: high
  why: "In OrderService#order (lines 20-22), the order is first saved via orderRepository.save(order) and then immediately published to Kafka via fireOrderCreatedEvent(order) as two separate steps without a transactional outbox. If the app crashes between these two lines, the order is saved in the database but the event is never published, causing downstream services to miss the creation."
  outcome: event lost
  saw: writes to a repository and publishes (through fireOrderCreatedEvent)
target:

# Planted bug B10: a worker freezes mid-payment, long enough for Kafka to hand its partition to another worker, which
# applies the same payment. Then the frozen worker wakes up and applies it again. The freeze is a 15s delay in
# worker-1, just before it applies its 200th payment; the demo app takes a worker out of the group after 10s.
# faultline benchmark adds the settings that switch the bug on or off.
app: demo-app
journey: make-payment
risk:
  id: B10
  title: A frozen worker wakes up and writes stale data
  location: PaymentService#apply
  file: src/main/java/dev/faultline/demo/payment/PaymentService.java
  line: 57
  why: Hand-written benchmark plan for planted bug B10, which has no code pattern.
target:
  url: http://localhost:8080
  compose:
    file: deploy/docker-compose.yml
    profile: demo
    services: [toxiproxy, provider, api, worker-1, worker-2, worker-3]
    consumers: 3
database:
  url: jdbc:postgresql://localhost:5432/demo
  user: demo
  password: demo
  reset:
  - TRUNCATE payments
  - TRUNCATE processed_events
  - UPDATE accounts SET balance_minor = 1000000
  - UPDATE merchant SET balance_minor = 0
  - TRUNCATE outbox
  - TRUNCATE stub.charges
kafka:
  bootstrap: localhost:9092
  topic: payments.requested
  group: payment-worker
traffic:
  count: 2000
  rate: 100
  request:
    method: POST
    path: /payments
    body: |
      {"paymentId": "pay-${seed}-${seq}", "accountId": "acct-${int:1:100}", "amountMinor": ${int:100:5000}}
correlate_by:
  request_field: paymentId
  table: payments
  column: payment_id
fault:
  point: PaymentService#apply
  when: before
  action: delay
  duration: 15s
  nth_hit: 200
  times: 1
  target: worker-1
checks: [no-lost, no-duplicates, no-unexpected, faults-fired]
confirm:
  runs: 2
  baselines: 1
  min_failing: 2

# The demo app's planted bugs, and the hand-written plans that should confirm them.
# faultline benchmark runs each plan with only its bug switched on, then every plan with all bugs off,
# where nothing may be confirmed.
app: demo-app
app_dir: demo-app

# every bug off: the settings of the bug-free build
bug_free:
  payments.dedupe: claim-first
  payments.dedupe-key: payment-id
  payments.bad-messages: dead-letter
  payments.retries: in-place
  payments.processing: listener-thread
  payments.merchant-balance: locked
  payments.completed-events: outbox
  payments.provider.idempotency-key: payment-id
  payments.provider.retry: with-backoff

bugs:
  - id: B1
    title: Saves, then acknowledges the message
    pattern: P1
    location: PaymentListener#onMessage
    check: no-duplicates
    plan: b1.plan.yaml
    settings:
      payments.dedupe: none

  - id: B2
    title: Auto-commit with a thread pool
    pattern: P2
    location: PaymentListener#onMessage
    check: no-lost
    plan: b2.plan.yaml
    settings:
      payments.processing: thread-pool

  - id: B3
    title: Dedupes by message ID only, so a double submit slips through
    pattern: P3
    location: PaymentService#process
    check: one-charge-per-payment
    plan: b3.plan.yaml
    settings:
      payments.dedupe-key: event-id

  - id: B4
    title: Read-modify-write on the balance
    pattern: P4
    location: MerchantBalance#credit
    check: shop-balance-adds-up
    plan: b4.plan.yaml
    settings:
      payments.merchant-balance: read-then-write

  - id: B5
    title: Retries a timed-out charge without an idempotency key
    pattern: P5
    location: ProviderClient#charge
    check: one-charge-per-payment-at-the-provider
    plan: b5.plan.yaml
    settings:
      payments.provider.idempotency-key: none

  - id: B6
    title: Immediate, unlimited retries
    pattern: P6
    location: ProviderClient#charge
    check: recovery-within
    plan: b6.plan.yaml
    settings:
      payments.provider.retry: immediately

  - id: B7
    title: No dead-letter handling for bad messages
    pattern: P7
    location: PaymentListener#onMessage
    check: no-lost
    plan: b7.plan.yaml
    settings:
      payments.bad-messages: retry-forever

  - id: B8
    title: Saves, then publishes "payment completed"
    pattern: P8
    location: CompletedEvents#onCommitted
    check: no-lost-downstream
    plan: b8.plan.yaml
    settings:
      payments.completed-events: after-commit

  - id: B9
    title: A retry topic reorders events for one account
    # no code pattern on purpose: only breaking the app finds it
    check: per-key-order
    plan: b9.plan.yaml
    settings:
      payments.retries: retry-topic

  - id: B10
    title: A frozen worker wakes up and writes stale data
    # no code pattern on purpose: only breaking the app finds it
    check: no-duplicates
    plan: b10.plan.yaml
    settings:
      payments.dedupe: check-then-insert

name: ci
on: [push, pull_request]

jobs:
  demo-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw -B verify

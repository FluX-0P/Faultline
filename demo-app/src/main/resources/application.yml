spring:
  application:
    name: demo-app
  datasource:
    url: jdbc:postgresql://localhost:5432/demo
    username: demo
    password: demo
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: payment-worker
      enable-auto-commit: false
      auto-offset-reset: earliest
      properties:
        # a crashed worker is noticed after 6s instead of the default 45s, so a restarted one resumes quickly
        "[session.timeout.ms]": 6000
        "[heartbeat.interval.ms]": 2000
        # a worker stuck on one message for 10s is taken out of the group and its partitions handed to another
        "[max.poll.interval.ms]": 10000
    listener:
      # the offset is committed exactly when the code calls acknowledge()
      ack-mode: manual_immediate

# The planted bugs, each switched by a setting. Every default here plants one; the bug-free values are in
# benchmark/bugs.yaml. Faultline's scan reads the defaults, so they are the version it judges.
payments:
  # how a redelivered payment is recognised: none (B1), check-then-insert (B10) or claim-first (the fix)
  dedupe: none
  # which ID marks it processed: event-id (B3: a client's second submit gets a new one) or payment-id
  dedupe-key: event-id
  # a message that keeps failing: retry-forever (B7: it blocks its partition) or dead-letter
  bad-messages: retry-forever
  # a payment that fails: retry-topic (B9: later payments for its account overtake it) or in-place
  retries: retry-topic
  # where the API publishes; a chaos relay can sit between payments.raw and payments.requested
  inbound-topic: payments.requested
  # where a payment is processed: thread-pool (B2: its message is acknowledged before it is done) or listener-thread
  processing: thread-pool
  # how the shop's balance is credited: read-then-write (B4: two workers can add to the same old balance) or locked
  merchant-balance: read-then-write
  # the "payment completed" event: after-commit (B8: a crash in between loses it) or outbox
  completed-events: after-commit
  provider:
    # the payment provider every payment is charged at; empty runs the app without one, and nothing is charged
    url: ""
    # how long to wait for the provider's reply before trying again
    timeout: 1s
    # what makes a retried charge safe: none (B5: a charge that timed out is charged again) or payment-id
    idempotency-key: none
    # how a failed charge is retried: immediately (B6: a provider that is struggling gets buried) or with-backoff
    retry: immediately

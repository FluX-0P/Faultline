name: faultline

# shared by the demo app services below
x-demo-app: &demo-app
  image: faultline/demo-app:dev
  profiles: [demo]
  # a worker the fault agent crashes (exit 137) comes back by itself, like Kubernetes would restart it
  restart: on-failure
  depends_on:
    postgres: {condition: service_healthy}
    kafka: {condition: service_started}
  environment: &demo-env
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/demo
    SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:4.3.2
    hostname: kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # localhost:9092 for apps on your machine, kafka:19092 for apps inside Docker
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

  # The demo app, for Faultline's multi-worker runs: docker compose --profile demo up -d --build
  # api takes the HTTP traffic; worker-1..3 consume from Kafka. Faultline starts these itself during a run,
  # with that run's settings and fault agent, so you rarely start them by hand.
  api:
    <<: *demo-app
    build: ../demo-app
    ports: ["8080:8080"]
    environment:
      <<: *demo-env
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "false"

  worker-1:
    <<: *demo-app
    ports: ["8081:8080"]

  worker-2:
    <<: *demo-app
    ports: ["8082:8080"]

  worker-3:
    <<: *demo-app
    ports: ["8083:8080"]
